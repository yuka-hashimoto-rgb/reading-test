<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>解答・採点</title>
<style>
  :root { --ink:#1f2933; --blue:#e8f2fc; --line:#9cc3ec; --accent:#2f7fd1; --muted:#5b6b7a; --ok:#1d7a4b; --ng:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 16px; padding:12px; }
  legend { font-weight:700; font-size:17px; padding:0 6px; background:var(--blue); border-radius:4px; }
  label { display:flex; gap:12px; align-items:center; min-height:56px; padding:10px 12px; margin-top:8px; border:1px solid #d5dde5; border-radius:8px; font-size:17px; cursor:pointer; }
  label:has(input:checked) { background:var(--blue); border-color:var(--accent); }
  input[type=radio] { width:24px; height:24px; accent-color:var(--accent); flex:none; }
  button { width:100%; min-height:56px; font-size:18px; font-weight:700; border-radius:8px; border:2px solid var(--accent); cursor:pointer; }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:#fff; color:var(--accent); margin-top:12px; }
  .msg { color:var(--ng); min-height:1.6em; margin:8px 0 0; font-size:15px; }
  #result { margin-top:8px; }
  .score { font-size:32px; font-weight:700; background:var(--blue); border-radius:8px; padding:12px 16px; margin:0 0 12px; }
  .row { padding:10px 12px; border-bottom:1px solid #e3e9ef; }
  .ok { color:var(--ok); font-weight:700; } .ng { color:var(--ng); font-weight:700; }
  .guide { margin:12px 0; padding:12px; border-left:6px solid var(--line); background:#f7fafd; }
  textarea { width:100%; margin-top:10px; padding:10px 12px; font:inherit; font-size:16px; border:1px solid #d5dde5; border-radius:8px; resize:vertical; min-height:64px; }
  textarea:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  .memo { margin-top:6px; padding:8px 10px; background:#f7fafd; border-radius:6px; font-size:15px; white-space:pre-wrap; }
  .note { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>解答・採点</h1>
  <p class="sub">候補者の口頭回答に合わせて選択してください。</p>
  <div id="quiz"></div>
  <button class="primary" id="score">採点する</button>
  <p class="msg" id="msg" role="alert"></p>
  <section id="result" hidden></section>
</main>
<script>
const QUESTIONS = [
  { id:"q1", text:"初日は何時までに店舗へ行きますか？", choices:["午前9時30分","午前9時45分","午前10時"], answer:1, points:1 },
  { id:"q2", text:"電車が遅れている場合、どうしますか？", choices:["到着してから連絡する","わかった時点で担当者に電話する","同僚にだけ連絡する"], answer:1, points:1 },
  { id:"q3", text:"勤務時間は何時から何時までですか？", choices:["9時45分〜19時","10時〜19時","10時〜18時"], answer:1, points:1 }
];
const L = ["A","B","C","D"];
const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render() {
  $("quiz").innerHTML = QUESTIONS.map((q, i) =>
    `<fieldset><legend>Q${i+1}. ${q.text}</legend>` +
    q.choices.map((c, j) => `<label><input type="radio" name="${q.id}" value="${j}"> ${L[j]}. ${c}</label>`).join("") +
    `<textarea name="memo-${q.id}" rows="2" placeholder="メモ（例：ここが弱かった／細かい説明が必要だった）"></textarea></fieldset>`).join("");
}

function grade() {
  const picks = QUESTIONS.map(q => { const el = document.querySelector(`input[name=${q.id}]:checked`); return el ? +el.value : null; });
  const missing = picks.map((p, i) => p === null ? "Q" + (i+1) : null).filter(Boolean);
  if (missing.length) { $("msg").textContent = missing.join("・") + " が未選択です。"; return; }
  $("msg").textContent = "";
  const memos = QUESTIONS.map(q => document.querySelector(`textarea[name=memo-${q.id}]`).value.trim());
  let total = 0, max = 0, lines = [];
  const rows = QUESTIONS.map((q, i) => {
    max += q.points;
    const ok = picks[i] === q.answer;
    if (ok) total += q.points;
    lines.push(`Q${i+1} ${ok ? "○" : "×"}` + (memos[i] ? ` メモ：${memos[i]}` : ""));
    return `<div class="row"><b>Q${i+1}</b> ` + (ok ? `<span class="ok">○ 正解</span>` :
      `<span class="ng">× 不正解</span><br>正しい答え：${L[q.answer]}. ${q.choices[q.answer]}`) +
      (memos[i] ? `<div class="memo">メモ：${esc(memos[i])}</div>` : "") + `</div>`;
  }).join("");
  const guide = total === max ? "今回の文章について、基本的な情報を読み取れている"
    : total === max - 1 ? "一部理解できている。間違えた内容を確認する"
    : "文章の理解度について、追加確認を推奨する";
  $("result").innerHTML = `<p class="score">${total}/${max}点</p>${rows}
    <div class="guide"><b>評価目安</b><br>${guide}</div>
    <p class="note">この3問の結果だけで、日本語能力全体を判断しないでください。</p>
    <button class="secondary" id="copy">結果とメモをコピー</button>
    <button class="secondary" id="reset">もう一度テストする</button>`;
  $("result").hidden = false;
  $("score").hidden = true;
  $("reset").onclick = reset;
  $("copy").onclick = () => {
    const text = `読み取りテスト ${total}/${max}点\n` + lines.join("\n");
    navigator.clipboard.writeText(text).then(() => { $("copy").textContent = "コピーしました"; }, () => { $("copy").textContent = "コピーできませんでした"; });
  };
  $("result").scrollIntoView({ behavior:"smooth" });
}

function reset() {
  render();
  $("result").hidden = true; $("result").innerHTML = "";
  $("score").hidden = false; $("msg").textContent = "";
  window.scrollTo({ top:0, behavior:"smooth" });
}

$("score").onclick = grade;
render();
</script>
</body>
</html>
